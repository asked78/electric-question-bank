<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高压电工错题集</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
        body{background:#f5f7fa;padding:15px;color:#222;min-height:100vh}
        /* 顶部 Tab 横向可滚动 */
        .tab{display:flex;gap:8px;margin-bottom:20px;overflow-x:auto;padding-bottom:6px}
        .tab::-webkit-scrollbar{display:none}
        .tab button{flex-shrink:0;padding:12px 14px;border:none;border-radius:8px;font-size:14px;background:#fff;color:#222;box-shadow:0 1px 3px #ddd}
        .tab .active{background:#2563eb;color:#fff;box-shadow:0 1px 3px #2563eb55}
        .page{display:none}
        .page.show{display:block}
        .q-box{background:#fff;border-radius:10px;padding:18px;margin-bottom:15px;box-shadow:0 1px 3px #ddd}
        .q-title{font-size:16px;line-height:1.6;margin-bottom:16px;font-weight:600;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
        .q-title-wrap{display:flex;flex:1;gap:8px;align-items:flex-start}
        .q-title-done-tag{color:#16a34a;font-size:14px;font-weight:bold;white-space:nowrap}
        .star-btn{font-size:22px;background:transparent;border:none;padding:0 6px;cursor:pointer;flex-shrink:0}
        .star-off{color:#999}
        .star-on{color:#f59e0b}
        .opt{padding:12px 14px;border:1px solid #e5e7eb;border-radius:8px;margin-bottom:10px;cursor:pointer;position:relative}
        .opt.selected{border-color:#2563eb;background:#eff6ff}
        .opt-done-mark{position:absolute;right:10px;top:8px;color:#16a34a;font-weight:bold;font-size:14px}
        .btns{display:flex;gap:10px;margin-top:20px}
        .btns-row2{display:flex;gap:10px;margin-top:12px}
        .btns-row3{display:flex;gap:10px;margin-top:12px}
        .btns-row4{display:flex;gap:10px;margin-top:12px}
        .jump-unfinish{padding:13px;background:#10b981;color:#fff;border:none;border-radius:8px;font-size:16px;width:100%}
        .clear-fav{padding:13px;background:#f97316;color:#fff;border:none;border-radius:8px;width:100%;margin-top:10px}
        /* 删除本题（红色） */
        .delete-one{padding:13px;background:#ef4444;color:#fff;border:none;border-radius:8px;width:100%;font-size:16px}
        /* 恢复本题（绿色） */
        .restore-one{padding:13px;background:#10b981;color:#fff;border:none;border-radius:8px;width:100%;font-size:16px}
        button{cursor:pointer}
        .submit{flex:1;padding:13px;background:#2563eb;color:#fff;border:none;border-radius:8px;font-size:16px}
        .next{padding:13px;background:#94a3b8;color:#fff;border:none;border-radius:8px;font-size:16px}
        .redo-one{padding:13px;background:#0284c7;color:#fff;border:none;border-radius:8px;font-size:16px}
        .redo-all{padding:13px;background:#f59e0b;color:#fff;border:none;border-radius:8px;width:100%}
        .tip{margin-top:12px;padding:10px;border-radius:8px;display:none;font-size:15px;line-height:1.7}
        .right{background:#dcfce7;color:#166534;display:block}
        .wrong{background:#fee2e2;color:#b91c1c;display:block}
        .count{margin-bottom:10px;color:#666}
        .empty{text-align:center;padding:40px;color:#888;font-size:18px}
        .analysis{margin-top:15px;padding:14px;background:#f0f7ff;border-radius:8px;display:none}
        .analysis h4{margin-bottom:8px;color:#2563eb}
        .analysis p{margin:6px 0;line-height:1.6}
        .reset-wrap{margin-top:20px;display:flex;flex-direction:column;gap:10px}
        #reset{width:100%;padding:12px;background:#ef4444;color:#fff;border:none;border-radius:8px;font-size:16px}
        .progress{margin:8px 0 15px;color:#2563eb;font-weight:500}
        .q-done-wrap{opacity:0.85;background:#f8fcf9 !important}
        .swipe-hint{text-align:center;color:#999;font-size:13px;margin:14px 0 4px}
        .meta-line{font-size:12px;color:#888;margin-top:6px}
        /* OCR 上传 Tab 按钮（红色高亮） */
        .tab-ocr{background:#dc2626 !important;color:#fff !important;box-shadow:0 1px 3px #dc262655 !important}
        /* OCR Modal */
        .modal-mask{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 15px}
        .modal-body{background:#fff;border-radius:12px;padding:20px;max-width:600px;width:100%;margin:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
        .modal-body h3{margin-bottom:15px;color:#dc2626;display:flex;justify-content:space-between;align-items:center}
        .modal-body h3 .close-x{font-size:24px;color:#999;cursor:pointer;background:none;border:none;padding:0 6px}
        .modal-step{margin-bottom:18px;padding-bottom:15px;border-bottom:1px dashed #e5e7eb}
        .modal-step-title{font-size:14px;font-weight:600;color:#374151;margin-bottom:10px;display:flex;align-items:center;gap:6px}
        .modal-step-title .step-num{background:#dc2626;color:#fff;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px}
        .ocr-input{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;margin-bottom:8px;font-family:inherit}
        .ocr-textarea{width:100%;padding:10px;border:1px solid #d1d5db;border-radius:8px;font-size:14px;min-height:80px;resize:vertical;font-family:inherit;box-sizing:border-box}
        .ocr-preview-img{max-width:100%;border-radius:8px;margin:8px 0;display:block;border:1px solid #e5e7eb}
        .ocr-btn{padding:12px;border:none;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;width:100%;margin-top:5px}
        .ocr-btn-primary{background:#dc2626;color:#fff}
        .ocr-btn-primary:disabled{background:#9ca3af;cursor:not-allowed}
        .ocr-btn-secondary{background:#2563eb;color:#fff}
        .ocr-btn-success{background:#16a34a;color:#fff}
        .ocr-btn-parse{background:#0284c7;color:#fff}
        .ocr-status{padding:10px;border-radius:8px;font-size:13px;margin:8px 0;display:none}
        .ocr-status.show{display:block}
        .ocr-status.loading{background:#fef3c7;color:#92400e}
        .ocr-status.success{background:#dcfce7;color:#166534}
        .ocr-status.error{background:#fee2e2;color:#b91c1c}
        .opt-row{display:flex;gap:8px;margin-bottom:6px;align-items:center}
        .opt-row select{padding:8px;border:1px solid #d1d5db;border-radius:6px;background:#f9fafb}
        .opt-row input{flex:1;padding:8px;border:1px solid #d1d5db;border-radius:6px;font-size:14px}
        .opt-row .opt-del{background:#ef4444;color:#fff;border:none;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px}
        .opt-add-btn{background:#f3f4f6;color:#374151;border:1px dashed #9ca3af;padding:8px;border-radius:6px;cursor:pointer;width:100%;font-size:13px;margin-top:4px}
        .modal-footer{display:flex;gap:10px;margin-top:15px}
        .modal-footer .ocr-btn{margin-top:0}
        .loading-spinner{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin 1s linear infinite;margin-right:6px;vertical-align:-2px}
        @keyframes spin{to{transform:rotate(360deg)}}
        .row-2col{display:flex;gap:10px;margin-bottom:8px}
        .row-2col > *{flex:1}
    </style>
</head>
<body>

<div class="tab">
    <button class="active" onclick="switchTab('all')">全部题目(<span id="allNum">0</span>)</button>
    <button onclick="switchTab('wrong')">待重做错题(<span id="wrongNum">0</span>)</button>
    <button onclick="switchTab('favorite')">收藏题目(<span id="favNum">0</span>)</button>
    <button onclick="switchTab('recent')">最近新增(<span id="recentNum">0</span>)</button>
    <button onclick="switchTab('recycle')">🗑回收站(<span id="recycleNum">0</span>)</button>
    <button class="tab-ocr" onclick="goUploadPage()">📷上传题目</button>
</div>

<!-- 全部题目页 -->
<div id="all" class="page show">
    <div class="progress">学习进度：<span id="finishCount">0</span>/<span id="allTotalShow">0</span> 题已完成（做完题目不会消失，可来回翻看）</div>
    <div class="count">当前题号：<span id="allIdx">1</span> / <span id="allTotalShow2">0</span></div>
    <div class="q-box" id="allQBox">
        <div class="q-title">
            <div class="q-title-wrap" id="allQ"></div>
            <button class="star-btn star-off" id="starAllBtn" onclick="toggleFavorite(allVisibleList[allIndex])">☆</button>
        </div>
        <div id="allOpts"></div>
        <div class="btns">
            <button class="submit" onclick="checkAll()">提交答案（备用）</button>
            <button class="next" onclick="nextAll()">下一题（优先未做题）</button>
        </div>
        <div class="btns-row3">
            <button class="jump-unfinish" onclick="jumpFirstUnfinished()">直接跳转第一道未完成题目</button>
        </div>
        <div class="btns-row4">
            <button class="delete-one" onclick="deleteCurrentQuestion()">🗑 删除本题（从题库永久移除）</button>
        </div>
        <div class="btns-row2">
            <button class="redo-one" onclick="redoCurrentQuestion()">取消本题完成标记，重新刷题</button>
        </div>
        <div class="tip" id="allTip"></div>
        <div class="analysis" id="allAnalysis"></div>
    </div>
    <div class="swipe-hint">← 右滑上一题 | 左滑下一题 →</div>
    <div class="reset-wrap">
        <button class="redo-all" onclick="redoAllFinish()">把所有已完成题目恢复为未完成，全部重做</button>
        <button id="reset" onclick="clearStorage()">清空所有做题记录（重置错题+完成记录，收藏/回收站/最近新增不清除）</button>
    </div>
</div>

<!-- 错题重做页 -->
<div id="wrong" class="page">
    <div class="count">错题剩余：<span id="wrongIdx">0</span> / <span id="totalWrong">0</span></div>
    <div class="q-box" id="wrongBox">
        <div class="q-title">
            <div class="q-title-wrap" id="wrongQ"></div>
            <button class="star-btn star-off" id="starWrongBtn" onclick="toggleFavorite(wrongList[wrongIndex])">☆</button>
        </div>
        <div id="wrongOpts"></div>
        <div class="btns">
            <button class="submit" onclick="checkWrong()">提交答案（备用）</button>
            <button class="next" onclick="nextWrong()">下一题</button>
        </div>
        <div class="btns-row4">
            <button class="delete-one" onclick="deleteFromList('wrong')">🗑 删除本题（从题库永久移除）</button>
        </div>
        <div class="tip" id="wrongTip"></div>
        <div class="analysis" id="wrongAnalysis"></div>
    </div>
    <div class="empty" id="emptyTip">🎉 所有错题全部答对，通关！</div>
</div>

<!-- 收藏页面 -->
<div id="favorite" class="page">
    <div class="count">收藏题目：<span id="favIdx">0</span> / <span id="totalFav">0</span></div>
    <div class="q-box" id="favBox">
        <div class="q-title">
            <div class="q-title-wrap" id="favQ"></div>
            <button class="star-btn star-on" id="starFavBtn" onclick="toggleFavorite(favoriteList[favIndex])">★</button>
        </div>
        <div id="favOpts"></div>
        <div class="btns">
            <button class="submit" onclick="checkFav()">提交答案（备用）</button>
            <button class="next" onclick="nextFav()">下一题</button>
        </div>
        <div class="btns-row4">
            <button class="delete-one" onclick="deleteFromList('favorite')">🗑 删除本题（从题库永久移除）</button>
        </div>
        <div class="tip" id="favTip"></div>
        <div class="analysis" id="favAnalysis"></div>
    </div>
    <div class="empty" id="favEmpty">暂无收藏题目，去全部题目页点击星星收藏</div>
    <div class="reset-wrap">
        <button class="clear-fav" onclick="clearAllFavorite()">一键清空全部收藏（不影响错题/完成记录）</button>
    </div>
</div>

<!-- 最近新增 -->
<div id="recent" class="page">
    <div class="count">最近新增：<span id="recentIdx">0</span> / <span id="totalRecent">0</span></div>
    <div class="q-box" id="recentBox">
        <div class="q-title">
            <div class="q-title-wrap" id="recentQ"></div>
            <button class="star-btn star-off" id="starRecentBtn" onclick="toggleFavorite(recentList[recentIndex])">☆</button>
        </div>
        <div id="recentOpts"></div>
        <div class="btns">
            <button class="submit" onclick="checkRecent()">提交答案（备用）</button>
            <button class="next" onclick="nextRecent()">下一题</button>
        </div>
        <div class="btns-row4">
            <button class="delete-one" onclick="deleteFromList('recent')">🗑 删除本题（从题库永久移除）</button>
        </div>
        <div class="tip" id="recentTip"></div>
        <div class="analysis" id="recentAnalysis"></div>
    </div>
    <div class="empty" id="recentEmpty">暂无最近新增题目（按题目入库时间倒序展示）</div>
    <div class="reset-wrap">
        <button style="padding:13px;background:#f97316;color:#fff;border:none;border-radius:8px;width:100%;font-size:15px" onclick="clearUserAddedQuestions()">🧹 清空所有用户添加的题目（恢复到 71 道种子题）</button>
    </div>
</div>

<!-- 回收站 -->
<div id="recycle" class="page">
    <div class="count">回收站：<span id="recycleIdx">0</span> / <span id="totalRecycle">0</span></div>
    <div class="q-box" id="recycleBox">
        <div class="q-title">
            <div class="q-title-wrap" id="recycleQ"></div>
            <button class="star-btn star-off" id="starRecycleBtn" onclick="toggleFavorite(recycleList[recycleIndex])">☆</button>
        </div>
        <div class="meta-line" id="recycleMeta"></div>
        <div id="recycleOpts"></div>
        <div class="btns-row4">
            <button class="restore-one" onclick="restoreCurrent()">♻️ 恢复本题到全部题目</button>
        </div>
        <div class="btns-row4">
            <button class="delete-one" onclick="purgeCurrent()">❌ 彻底删除（无法恢复）</button>
        </div>
    </div>
    <div class="empty" id="recycleEmpty">回收站是空的</div>
    <div class="reset-wrap">
        <button class="clear-fav" onclick="emptyRecycle()">🧹 一键清空回收站（彻底删除全部）</button>
    </div>
</div>

<script>
/* =========================================================
   原始题库（继承自旧版本 73 道题）
   每道题在首次加载时自动打上 addedAt = Date.now()，从而
   支持「最近新增」按时间倒序展示。
   ========================================================= */
const SEED_QUESTIONS = [
    {type:"单选",q:"接地装置是防雷装置的主要组成部分，作用是（），限制防雷装置的对地电压，使之不至过高",opts:["A 削弱雷电能量","B 泄放雷电流","C 切断雷电电流"],ans:1,expl:"【解析】雷电巨大电流必须通过接地装置导入大地，也就是泄放雷电流；无法削弱、切断。\n【速记口诀】防雷接地泄雷流，大地分担高压愁\n【试题心得】防雷题看到接地装置，核心功能永远选泄放电流"},
    {type:"判断",q:"电力电缆的绑扎工作原则上敷设一排、绑扎一排。",opts:["正确","错误"],ans:1,expl:"【解析】规范要求电缆全部敷设完成后统一绑扎，不能敷一排绑一排。\n【速记口诀】电缆敷设全做完，统一绑扎不乱断\n【试题心得】题干出现“敷设一排绑扎一排”直接判定错误"},
    {type:"判断",q:"电力电缆按照电缆的电压等级来选择的。",opts:["正确","错误"],ans:1,expl:"【解析】电缆选型不止看电压，还要核算载流量、截面等。\n【速记口诀】选电缆不只看电压，载流环境也要查\n【试题心得】单一条件选型一律错"},
    {type:"判断",q:"电工作业人员应根据实际情况遵守有关安全法规,规程和制度。",opts:["正确","错误"],ans:1,expl:"【解析】安全规程强制遵守，不能变通。\n【速记口诀】电工规程强制守，不可随意变通走"},
    {type:"判断",q:"电磁式仪表由可转动线圈、固定铁芯及转轴、游丝、指针、机械调零机构等组成。",opts:["正确","错误"],ans:1,expl:"【解析】可动线圈是磁电式，电磁是固定线圈、可动铁片。"},
    {type:"判断",q:"低压照明用户供电电压允许偏差为额定电压的+10%~−10%。",opts:["正确","错误"],ans:1,expl:"【解析】照明标准+7%~-10%"},
    {type:"判断",q:"避雷针一般安装在支柱(电杆)上或其他构架、建筑物上,必须经引下线与接地体可靠连接。",opts:["正确","错误"],ans:0,expl:"【解析】针、引线、接地三者缺一不可"},
    {type:"判断",q:"避雷器可以用来防止雷电侵入高压电气设备，也可以用来保护小型独立的建筑物免遭雷击。",opts:["正确","错误"],ans:1,expl:"【解析】避雷器只防感应雷，不防建筑直击雷"},
    {type:"判断",q:"避雷带是沿建筑物易受雷击的部位(如屋脊、屋檐、屋角等处)装设的带状导体。",opts:["正确","错误"],ans:0,expl:"【解析】避雷带标准定义"},
    {type:"判断",q:"带绝缘柄的工具、绝缘手套、试电笔都属于低压基本安全用具",opts:["正确","错误"],ans:0,expl:"【解析】题库标准答案正确"},
    {type:"判断",q:"绝缘鞋和绝缘靴都属于低压基本安全用具",opts:["正确","错误"],ans:1,expl:"【解析】属于辅助安全用具"},
    {type:"判断",q:"手动导线压接钳也利用杠杆原理工作，多用于截面35mm2以上的导线接头的钳接管压接",opts:["正确","错误"],ans:1,expl:"【解析】35平方以上用液压钳"},
    {type:"判断",q:"电度表是专门用来测量设备功率的装置。",opts:["正确","错误"],ans:1,expl:"【解析】电表测电能，不是功率"},
    {type:"判断",q:"工频电流比高频电流更容易引起皮肤灼伤。",opts:["正确","错误"],ans:1,expl:"【解析】高频集肤效应灼伤更重"},
    {type:"单选",q:"5kV绝缘鞋适用于电工穿用，在电压( )kV以下为辅助安全用具。",opts:["A 1","B 3","C 5","D 10"],ans:0,expl:"【解析】仅限1kV以下"},
    {type:"判断",q:"组合开关可直接起动5kW以下的电动机。",opts:["正确","错误"],ans:0,expl:"【解析】规范允许"},
    {type:"单选",q:"第( )类是间接接触电击防护措施。",opts:["A 一","B 二","C 三","D 四"],ans:1,expl:"【解析】二类双重绝缘间接防护"},
    {type:"单选",q:"交流接触器的机械寿命是指在不带负载的操作次数，一般达( )。",opts:["A 10万次以下","B 600–1000万次","C 10000万次以上"],ans:1,expl:"【解析】机械寿命千万次"},
    {type:"判断",q:"护套线弯曲，弯曲半径不小于护套线外径4倍",opts:["正确","错误"],ans:0,expl:"【解析】施工规范"},
    {type:"判断",q:"电阻、电感、电容的并联电路中，当容抗与感抗相等时将发生电压谐振",opts:["正确","错误"],ans:1,expl:"【解析】并联电流谐振"},

/* =========================================================
   全局状态
   ========================================================= */
let questions = [];            // 当前题库（剔除回收站后）
let recycleList = [];          // 回收站里的题（题对象，含 deletedAt）
let allVisibleList = [];       // 「全部题目」页的有效 id 列表（即 questions 的下标）
let wrongList = [];
let favoriteList = [];
let recentList = [];           // 最近新增（按 addedAt 倒序的题 id 列表）
let finished = [];
let allIndex = 0, wrongIndex = 0, favIndex = 0, recentIndex = 0, recycleIndex = 0;
let selectAll = null, selectWrong = null, selectFav = null, selectRecent = null;
let touchStartX = 0;
const SWIPE_THRESHOLD = 50;

const STORAGE_KEY = "electric_wrong_questions";
const FINISH_KEY  = "electric_finished_questions";
const FAV_KEY     = "electric_favorite_questions";
const REC_KEY     = "electric_recycle_questions";      // 新增：[{...question, deletedAt}]
const QB_KEY      = "electric_question_bank";          // 新增：题库持久化（含 addedAt）
const SEED_FLAG   = "electric_seed_v1_done";            // 新增：种子题库写入标记

/* =========================================================
   持久化
   ========================================================= */
function loadStorage(){
    // 1) 题库
    const qb = localStorage.getItem(QB_KEY);
    if(qb){
        try{ questions = JSON.parse(qb); }catch(e){ questions = []; }
    }
    if(!questions || questions.length===0){
        // 首次：把种子题库写入并打 addedAt
        const now = Date.now();
        questions = SEED_QUESTIONS.map((q,i)=>({ ...q, addedAt: now - (SEED_QUESTIONS.length - i) * 1000 }));
        localStorage.setItem(QB_KEY, JSON.stringify(questions));
        localStorage.setItem(SEED_FLAG, "1");
    }else{
        // 兼容：老题库若没 addedAt，依次补上（用 now - 顺序*1000，模拟"老题更早"）
        let patched = false;
        const now = Date.now();
        questions.forEach((q,i)=>{
            if(typeof q.addedAt !== "number"){ q.addedAt = now - (questions.length - i) * 60000; patched = true; }
        });
        if(patched) localStorage.setItem(QB_KEY, JSON.stringify(questions));

        // ★ 预览版特性：检测是否有新种子题需要追加（按题干匹配）
        const existingQs = new Set(questions.map(q => q.q));
        const newOnes = SEED_QUESTIONS.filter(sq => !existingQs.has(sq.q));
        if(newOnes.length > 0){
            // 把新种子题追加到末尾，addedAt 设为最大，确保排在最近新增最前
            const maxAddedAt = Math.max(...questions.map(q => q.addedAt || 0), Date.now());
            newOnes.forEach((sq, i) => {
                questions.push({ ...sq, addedAt: maxAddedAt + (i + 1) * 1000000 });
            });
            localStorage.setItem(QB_KEY, JSON.stringify(questions));
        }
    }

    // 2) 错题
    wrongList = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
    // 3) 完成
    finished  = JSON.parse(localStorage.getItem(FINISH_KEY)  || "[]");
    // 4) 收藏
    favoriteList = JSON.parse(localStorage.getItem(FAV_KEY) || "[]");
    // 5) 回收站
    recycleList  = JSON.parse(localStorage.getItem(REC_KEY) || "[]");

    // 6) 清理越界 id
    const validLen = questions.length;
    wrongList     = wrongList.filter(i=>i>=0 && i<validLen);
    finished      = finished.filter(i=>i>=0 && i<validLen);
    favoriteList  = favoriteList.filter(i=>i>=0 && i<validLen);

    rebuildRecent();
    rebuildAllVisible();
    updateAllUI();
}

function saveStorage(){localStorage.setItem(STORAGE_KEY,JSON.stringify(wrongList));updateWrongUI();}
function saveFinish(){localStorage.setItem(FINISH_KEY,JSON.stringify(finished));updateFinishUI();}
function saveFav(){localStorage.setItem(FAV_KEY,JSON.stringify(favoriteList));updateFavUI();}
function saveRecycle(){localStorage.setItem(REC_KEY,JSON.stringify(recycleList));updateRecycleUI();}
function saveBank(){localStorage.setItem(QB_KEY,JSON.stringify(questions));}

function rebuildAllVisible(){
    allVisibleList = questions.map((_,i)=>i);
    if(allIndex >= allVisibleList.length) allIndex = 0;
}
function rebuildRecent(){
    // 「最近新增」只显示用户添加的题目（不含种子题）
    // 通过题干匹配种子题，过滤掉
    const seedQs = new Set(SEED_QUESTIONS.map(sq => sq.q));
    const order = questions
        .map((q,i)=>({i, t:q.addedAt||0}))
        .filter(o => !seedQs.has(questions[o.i].q))   // 只保留用户添加的
        .sort((a,b)=>b.t-a.t)
        .map(o=>o.i);
    recentList = order;
    if(recentIndex >= recentList.length) recentIndex = 0;
}

/* =========================================================
   收藏
   ========================================================= */
function toggleFavorite(qId){
    if(qId === undefined || qId === null) return;
    const idx = favoriteList.indexOf(qId);
    if(idx > -1){favoriteList.splice(idx,1);}
    else{favoriteList.push(qId);}
    saveFav();
    const activeId = document.querySelector('.page.show')?.id;
    if(activeId==='all') renderAll();
    if(activeId==='wrong') renderWrong();
    if(activeId==='favorite') renderFavorite();
    if(activeId==='recent') renderRecent();
    if(activeId==='recycle') renderRecycle();
}
function clearAllFavorite(){
    if(favoriteList.length===0){alert("暂无收藏");return;}
    if(!confirm(`清空 ${favoriteList.length} 道收藏？错题与完成记录不受影响`)) return;
    favoriteList=[];saveFav();renderFavorite();
}

/* =========================================================
   删除 / 恢复 / 彻底删除
   ========================================================= */
function moveToRecycle(qId, fromListName, fromArr){
    if(qId===undefined||qId===null) return;
    const q = questions[qId];
    if(!q) return;
    // 推入回收站
    recycleList.push({...q, _origId:qId, deletedAt: Date.now()});
    saveRecycle();
    // 从错题/收藏/完成 中清除该 id
    wrongList = wrongList.filter(i=>i!==qId); saveStorage();
    favoriteList = favoriteList.filter(i=>i!==qId); saveFav();
    finished = finished.filter(i=>i!==qId); saveFinish();
    // 从题库中真删
    questions.splice(qId,1);
    saveBank();
    // 所有引用此 id 的列表都要修正：>=qId 的 id 减 1
    [wrongList, favoriteList, finished].forEach(arr=>{
        for(let i=0;i<arr.length;i++){ if(arr[i] > qId) arr[i] -= 1; }
    });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(wrongList));
    localStorage.setItem(FAV_KEY,     JSON.stringify(favoriteList));
    localStorage.setItem(FINISH_KEY,  JSON.stringify(finished));
    // 重建索引
    rebuildAllVisible();
    rebuildRecent();
    updateAllUI();
    // 刷新当前页
    if(fromListName==='all') renderAll();
    if(fromListName==='wrong') renderWrong();
    if(fromListName==='favorite') renderFavorite();
    if(fromListName==='recent') renderRecent();
}

function deleteCurrentQuestion(){
    const id = allVisibleList[allIndex];
    if(id===undefined) return;
    if(!confirm("确定要删除本题吗？删除后会进入回收站，可在那里恢复。")) return;
    moveToRecycle(id, 'all');
}
function deleteFromList(from){
    let id;
    if(from==='wrong'){ id = wrongList[wrongIndex]; }
    else if(from==='favorite'){ id = favoriteList[favIndex]; }
    else if(from==='recent'){ id = recentList[recentIndex]; }
    if(id===undefined) return;
    if(!confirm("确定要删除本题吗？删除后会进入回收站，可在那里恢复。")) return;
    moveToRecycle(id, from);
}
function restoreCurrent(){
    const item = recycleList[recycleIndex];
    if(!item) return;
    // 重新入题库（放最前面当作"新增"）
    const restored = {...item};
    delete restored._origId; delete restored.deletedAt;
    restored.addedAt = Date.now();
    questions.unshift(restored);
    saveBank();
    // 同步修正其他列表：所有 id +1（因为前面插了一条）
    [wrongList, favoriteList, finished].forEach(arr=>{ for(let i=0;i<arr.length;i++) arr[i]+=1; });
    localStorage.setItem(STORAGE_KEY, JSON.stringify(wrongList));
    localStorage.setItem(FAV_KEY,     JSON.stringify(favoriteList));
    localStorage.setItem(FINISH_KEY,  JSON.stringify(finished));
    // 从回收站移除
    recycleList.splice(recycleIndex,1);
    saveRecycle();
    rebuildAllVisible();
    rebuildRecent();
    updateAllUI();

/* 清空所有用户添加的题目（恢复到 71 道种子题） */
function clearUserAddedQuestions(){
    const total = questions.length;
    const seedCount = SEED_QUESTIONS.length;
    const userCount = total - seedCount;
    if(userCount <= 0){
        alert("没有用户添加的题目（当前题库就是原始 71 道种子题）");
        return;
    }
    if(!confirm(`确认清空用户添加的题目？\n\n当前题库共 ${total} 道\n其中种子题：${seedCount} 道（保留）\n用户添加：${userCount} 道（将被清空）\n\n注意：错题、收藏、完成记录中如果引用了被删的题，会自动清理`)){
        return;
    }
    // 保留前 seedCount 道（按 addedAt 最小的种子题）
    // 先排序找出种子题（种子题是按顺序加入的，addedAt 是 now - (len-i)*1000）
    const seedAt = SEED_QUESTIONS.map((_,i)=>0).length;
    // 简单方案：保留 addedAt 最小的 seedCount 道（即最早的）
    questions = questions.slice().sort((a,b)=>(a.addedAt||0)-(b.addedAt||0)).slice(0, seedCount);
    saveBank();
    // 清理错题/收藏/完成记录中越界的 id
    wrongList = wrongList.filter(i=>i>=0 && i<questions.length);
    finished = finished.filter(i=>i>=0 && i<questions.length);
    favoriteList = favoriteList.filter(i=>i>=0 && i<questions.length);
    saveStorage();saveFinish();saveFav();
    rebuildRecent();rebuildAllVisible();updateAllUI();
    renderAll();renderRecent();
    alert(`✅ 已清空 ${userCount} 道用户添加的题目\n当前题库剩余 ${questions.length} 道种子题`);
}

function jumpFirstUnfinished(){
    let target=null;
    for(let i=0;i<allVisibleList.length;i++){
        if(!finished.includes(allVisibleList[i])){ target=i; break; }
    }
    if(target===null){alert("全部做完啦！");return;}
    allIndex=target; renderAll();
}
function getNextUnfinished(){
    const total = allVisibleList.length;
    if(total===0) return 0;
    let next = (allIndex+1)%total;
    let steps=0;
    while(steps<total){
        if(!finished.includes(allVisibleList[next])) return next;
        next=(next+1)%total; steps++;
    }
    return (allIndex+1)%total;
}
function renderAll(){
    if(allVisibleList.length===0){
        document.getElementById('allQ').innerText = "题库为空";

    const fav = favoriteList.includes(id);

    let optHtml = '';

        optHtml += `<div class="opt" id="a${i}" onclick="clickCheckAll(${i})">${opt}${done?'<span class="opt-done-mark">✅已做完</span>':''}</div>`;

function bindSwipe(elId, onNext, onPrev){
    const el = document.getElementById(elId);
    if(!el) return;
    el.addEventListener('touchstart', e=> touchStartX = e.touches[0].clientX);
    el.addEventListener('touchend', e=>{
        const endX = e.changedTouches[0].clientX;
        const diff = endX - touchStartX;
        if(diff < -SWIPE_THRESHOLD) onNext && onNext();
        else if(diff > SWIPE_THRESHOLD) onPrev && onPrev();
    });
}

function onOcrFileChange(input){

        showOcrStatus('error', '❌ 图片不能超过 5MB');

/* 全自动流程：识别 + 解析 + 入题库 */
async function autoOcrAll(){
    if(!ocrCurrentImage){
        showOcrStatus('error', '❌ 请先选择图片');
        return;
    }
    // 显示进度
    showOcrStatus('loading', '<span class="loading-spinner"></span>正在识别文字...');
    const btn = document.getElementById('btnOcr');
    if(btn){ btn.disabled = true; btn.innerHTML = '<span class="loading-spinner"></span>识别中...'; }

    // 步骤 1：OCR 识别
    let words;
    try{
        const resp = await fetch(OCR_API, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: ocrCurrentImage })
        });
        const data = await resp.json();
        if(!resp.ok || data.error){
            showOcrStatus('error', '❌ 识别失败：' + (data.error || '未知错误') + '<br><small>请检查图片是否清晰，或稍后重试</small>');
            if(btn){ btn.disabled = false; btn.innerHTML = '🔍 重新识别'; }
            return;
        }
        words = data.words || data.lines || [];
        document.getElementById('ocrRawText').value = words.join('\n');
    }catch(e){
        showOcrStatus('error', '❌ 网络错误：' + e.message + '<br><small>请用 Vercel 部署的地址访问，GitHub Pages 不支持 OCR</small>');
        if(btn){ btn.disabled = false; btn.innerHTML = '🔍 重新识别'; }
        return;
    }

    // 步骤 2：智能解析
    showOcrStatus('loading', '<span class="loading-spinner"></span>识别成功 ✓ 正在解析题目...');
    const parsed = smartParse(words);
    if(!parsed){
        // 解析失败 → 让用户手动填写
        showOcrStatus('error', '⚠️ 无法自动解析题目结构，请手动填写下方表单');
        document.getElementById('parseType').value = '单选';
        document.getElementById('parseQ').value = words.join(' ');
        renderParseOpts(['', '', '', '']);
        if(btn){ btn.disabled = false; btn.innerHTML = '🔍 重新识别'; }
        return;
    }

    // 填充 UI（供用户查看）
    document.getElementById('parseType').value = parsed.type;
    document.getElementById('parseQ').value = parsed.q;
    renderParseOpts(parsed.opts);
    rebuildAnsSelect(parsed.opts.length, parsed.ans);
    document.getElementById('parseAns').value = parsed.ans;
    document.getElementById('parseExpl').value = parsed.expl || '';

    // 步骤 3：自动入题库
    showOcrStatus('loading', '<span class="loading-spinner"></span>解析完成 ✓ 正在加入题库...');
    const result = addToBank(parsed);
    if(result.success){
        showOcrStatus('success',
            `✅ 已自动加入题库！<br>` +
            `<small>题干：${escapeHtml(parsed.q.substring(0, 40))}${parsed.q.length > 40 ? '...' : ''}<br>` +
            `类型：${parsed.type} | 答案：${String.fromCharCode(65 + parsed.ans)}</small><br>` +
            `<small>可在「最近新增」Tab 查看，或点「再传一张」继续</small>`
        );
        if(btn){ btn.disabled = false; btn.innerHTML = '📷 再传一张'; }
        // 自动跳到最近新增
        setTimeout(() => {
            closeOcrModal();
            switchTab('recent');
            renderRecent();
        }, 1800);
    }else{
        showOcrStatus('error', '❌ 入题库失败：' + result.error);
        if(btn){ btn.disabled = false; btn.innerHTML = '🔍 重新识别'; }
    }
}

/* 智能解析（纯函数，返回 {type,q,opts,ans,expl} 或 null） */
function smartParse(words){
    if(!words || words.length === 0) return null;
    const lines = words.map(s => s.trim()).filter(s => s.length > 0);

    const optRegex = /^([A-D])[\.、\)\::\s]\s*(.+)$/;
    const judgeOpts = ['正确', '错误', '对', '错', '√', '×'];
    const ansRegexList = [
        /(?:答案|正确答案|参考答案|答)\s*[是:：为]\s*([A-D正确错误对错√×])/,
        /[（(]\s*([A-D正确错误对错√×])\s*[）)]/
    ];

    let opts = [];
    let optStartIdx = -1;
    for(let i = 0; i < lines.length; i++){
        const m = lines[i].match(optRegex);
        if(m){
            if(optStartIdx === -1) optStartIdx = i;
            const letter = m[1];
            const text = m[2].trim();
            const idx = letter.charCodeAt(0) - 65;
            opts[idx] = text;
        }
    }
    // 判断题选项
    if(opts.length === 0){
        for(let i = 0; i < lines.length; i++){
            if(judgeOpts.includes(lines[i])){
                if(optStartIdx === -1) optStartIdx = i;
                if(!opts.includes('正确')) opts.push('正确');
                else if(!opts.includes('错误')) opts.push('错误');
            }
        }
    }

    // 答案标号
    let ans = 0, ansFound = false;
    for(const re of ansRegexList){
        for(const line of lines){
            const m = line.match(re);
            if(m){
                const a = m[1];
                if(['A','B','C','D'].includes(a)) ans = a.charCodeAt(0) - 65;
                else if(a === '正确' || a === '对' || a === '√') ans = 0;
                else if(a === '错误' || a === '错' || a === '×') ans = 1;
                ansFound = true;
                break;
            }
        }
        if(ansFound) break;
    }

    // 题干
    let q = optStartIdx > 0 ? lines.slice(0, optStartIdx).join(' ') : lines.join(' ');
    q = q.replace(/^[\d]+[\.、\::\s]+/, '').trim();
    if(!q) return null;

    // 类型判断
    let type = '单选';
    if(opts.length === 2 && opts.includes('正确') && opts.includes('错误')){
        type = '判断';
        opts = ['正确', '错误'];
    }else if(opts.length < 2){
        return null;   // 解析不出选项，让用户手动填
    }

    return { type, q, opts, ans, expl: '【解析】待补充（OCR 自动添加）' };
}

/* 把解析结果加入题库 */
function addToBank(parsed){
    const type = parsed.type;
    const q = parsed.q.trim();
    const opts = parsed.opts.filter(o => o && o.length > 0);
    const ans = parseInt(parsed.ans);

    if(!q) return { success: false, error: '题干为空' };
    if(opts.length < 2) return { success: false, error: '选项不足 2 个' };
    if(isNaN(ans) || ans < 0 || ans >= opts.length) return { success: false, error: '答案标号无效' };

    // 标准化选项
    let finalOpts = opts;
    if(type === '单选'){
        finalOpts = opts.map((o, i) => {
            const letter = String.fromCharCode(65 + i);
            if(/^([A-D])[\.、\)\::\s]/.test(o)) return o;
            return letter + ' ' + o;
        });
    }else if(type === '判断'){
        finalOpts = ['正确', '错误'];
    }

    const newQ = {
        type: type,
        q: q,
        opts: finalOpts,
        ans: ans,
        expl: parsed.expl || '【解析】待补充',
        // ★ 让新加的题 addedAt 远超种子题，确保排在「最近新增」最前
        // 种子题 addedAt 最大约 = now（初始化时间）
        // 这里用 now + N*1000 偏移，确保稳定地排在最前面
        addedAt: Date.now() + (questions.length - SEED_QUESTIONS.length + 1) * 1000000
    };
    questions.push(newQ);
    saveBank();
    rebuildRecent();
    rebuildAllVisible();
    updateAllUI();
    return { success: true };
}


function renderParseOpts(opts){
    const container = document.getElementById('parseOptsContainer');
    container.innerHTML = '';
    opts.forEach((opt, i) => {
        const row = document.createElement('div');
        row.className = 'opt-row';
        const letter = String.fromCharCode(65 + i);
        row.innerHTML = `
            <select disabled><option>${letter}</option></select>
            <input type="text" value="${escapeHtml(opt)}" placeholder="选项 ${letter} 内容" data-opt-idx="${i}">
            <button class="opt-del" onclick="removeOptRow(this)">✕</button>
        `;
        container.appendChild(row);
    });
    // 如果不足 2 个，加一个"添加选项"按钮
    if(opts.length < 2){
        const addBtn = document.createElement('button');
        addBtn.className = 'opt-add-btn';
        addBtn.innerText = '+ 添加选项';
        addBtn.onclick = () => {
            const currentOpts = collectOpts();
            currentOpts.push('');
            renderParseOpts(currentOpts);
            rebuildAnsSelect(currentOpts.length, 0);
        };
        container.appendChild(addBtn);
    }
    rebuildAnsSelect(opts.length, 0);
}
function removeOptRow(btn){
    const row = btn.parentElement;
    const idx = parseInt(row.querySelector('input').dataset.optIdx);
    const opts = collectOpts();
    opts.splice(idx, 1);
    renderParseOpts(opts.length ? opts : ['']);
}
function collectOpts(){
    const inputs = document.querySelectorAll('#parseOptsContainer input[data-opt-idx]');
    const opts = [];
    inputs.forEach(inp => {
        const v = inp.value.trim();
        opts.push(v);
    });
    return opts.filter(o => o !== '' || opts.length <= 2);  // 至少保留 2 个
}
function rebuildAnsSelect(count, selectedIdx){
    const sel = document.getElementById('parseAns');
    sel.innerHTML = '';
    for(let i = 0; i < count; i++){
        const o = document.createElement('option');
        o.value = i;
        o.innerText = String.fromCharCode(65 + i);
        sel.appendChild(o);
    }
    sel.value = Math.min(selectedIdx, count - 1);
}
function onParseTypeChange(sel){
    const type = sel.value;
    if(type === '判断'){
        renderParseOpts(['正确', '错误']);
    }else if(type === '单选'){
        // 保留当前，但补足到至少 2 个
        const opts = collectOpts();
        while(opts.length < 2) opts.push('');
        renderParseOpts(opts);
    }
}
function escapeHtml(str){
    return String(str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

/* 加入题库 */
function addParsedToBank(){
    const type = document.getElementById('parseType').value;
    const q = document.getElementById('parseQ').value.trim();
    const opts = collectOpts().filter(o => o.length > 0);
    const ans = parseInt(document.getElementById('parseAns').value);
    const expl = document.getElementById('parseExpl').value.trim();

    if(!q){
        alert('题干不能为空');
        return;
    }
    if(opts.length < 2){
        alert('至少需要 2 个选项');
        return;
    }
    if(isNaN(ans) || ans < 0 || ans >= opts.length){
        alert('答案标号无效');
        return;
    }
    // 标准化选项：单选题加 "A " 前缀
    let finalOpts = opts;
    if(type === '单选'){
        finalOpts = opts.map((o, i) => {
            const letter = String.fromCharCode(65 + i);
            // 已有前缀的不重复加
            if(/^([A-D])[\.、\)\::\s]/.test(o)) return o;
            return letter + ' ' + o;
        });
    }
    // 判断题标准化
    if(type === '判断'){
        finalOpts = ['正确', '错误'];
    }

    const newQ = {
        type: type,
        q: q,
        opts: finalOpts,
        ans: ans,
        expl: expl || '【解析】待补充',
        addedAt: Date.now()
    };

    questions.push(newQ);
    saveBank();
    rebuildRecent();
    rebuildAllVisible();
    updateAllUI();

    closeOcrModal();
    switchTab('recent');
    renderRecent();
    alert(`✅ 已加入题库！\n题干：${q.substring(0, 40)}${q.length > 40 ? '...' : ''}\n\n可在「最近新增」Tab 查看`);
}
</script>

<!-- OCR 上传 Modal（极简版） -->
<div id="ocrModal" class="modal-mask" style="display:none">
    <div class="modal-body">
        <h3>
            <span>📷 上传题目截图</span>
            <button class="close-x" onclick="closeOcrModal()">×</button>
        </h3>

        <!-- 选图（选完自动完成全流程） -->
        <label for="ocrFile" style="display:block;background:#dc2626;color:#fff;padding:18px;border-radius:10px;text-align:center;cursor:pointer;font-size:16px;font-weight:600;margin-bottom:10px">
            📁 点击选择图片（截图/相册）
        </label>
        <input type="file" id="ocrFile" accept="image/*" onchange="onOcrFileChange(this)" style="display:none">
        <img id="ocrPreview" class="ocr-preview-img" style="display:none">

        <!-- 状态提示 -->
        <div id="ocrStatus" class="ocr-status"></div>

        <!-- 隐藏的备用按钮（自动流程中切换显示） -->
        <button id="btnOcr" class="ocr-btn ocr-btn-primary" style="display:none">🔍 开始识别</button>

        <!-- 详情区（默认折叠，识别失败时让用户手动填） -->
        <details id="ocrDetails" style="margin-top:10px">
            <summary style="cursor:pointer;color:#6b7280;font-size:13px;padding:6px">📝 手动编辑（识别失败时用，点击展开）</summary>
            <div style="margin-top:10px">
                <div class="row-2col">
                    <select id="parseType" class="ocr-input" onchange="onParseTypeChange(this)">
                        <option value="单选">单选题</option>
                        <option value="判断">判断题</option>
                    </select>
                    <select id="parseAns" class="ocr-input">
                        <option value="0">答案 A</option>
                    </select>
                </div>
                <textarea id="parseQ" class="ocr-textarea" placeholder="题干"></textarea>
                <div id="parseOptsContainer"></div>
                <textarea id="parseExpl" class="ocr-textarea" placeholder="解析（可选）"></textarea>
                <textarea id="ocrRawText" class="ocr-textarea" placeholder="识别原始文字" style="min-height:60px;font-size:12px;color:#888"></textarea>
                <button class="ocr-btn ocr-btn-success" onclick="addParsedToBank()">✅ 手动加入题库</button>
            </div>
        </details>

        <div class="modal-footer">
            <button class="ocr-btn" style="background:#6b7280;color:#fff" onclick="closeOcrModal()">关闭</button>
        </div>
    </div>
</div>
</body>
